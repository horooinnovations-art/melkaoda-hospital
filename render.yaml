services:
  - type: web
    name: melkaoda-hospital-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Melka Oda General Hospital
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Render's edge plus the Next.js rewrite proxy = 2 hops. Must match reality:
      # too high lets a client forge X-Forwarded-For (MEL-DEVOPS-001).
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Comma-separated operator addresses that hold users.is_root_admin — the
      # tier that can manage other super admins (MEL-SEC-001).
      - key: ROOT_ADMIN_EMAILS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: melkaoda-hospital
      - key: DB_SSL
        value: "true"
      # DB_SSL_INSECURE is deliberately absent: it set rejectUnauthorized=false,
      # leaving the Aiven connection encrypted but unauthenticated (MEL-SEC-005).
      # MYSQL_ATTR_SSL_CA below must hold the Aiven CA certificate PEM, or db.js
      # refuses to build a pool.
      - key: MEDIA_STORAGE_HOST
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false

  - type: web
    name: melkaoda-hospital-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_NAME
        value: Melka Oda General Hospital
      # robots.ts and sitemap.ts fall back to http://localhost:3000 without this,
      # which makes the live site unindexable (MEL-CFG-001). SITE_URL is read at
      # request time so it can be corrected without a rebuild; the NEXT_PUBLIC_
      # form is inlined at build time and is only needed by client code.
      - key: SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Must be the live API URL (baked into the client bundle at build time).
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_MEDIA_STORAGE_HOST
        sync: false
